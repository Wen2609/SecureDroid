# 本机 14GB 物理内存,同时跑 Gradle 守护进程 + Kotlin 守护进程 + Robolectric 会 OOM;
# 压到 1.5GB 堆并保留元空间上限,换来构建过程稳定(实测 -Xmx2048m 会因内存不足启动失败)。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 构建性能优化
# 并行构建在内存吃紧时会把守护进程挤死,这里关闭换取稳定性
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.incremental=true
